<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWETA COURIER — Tracking</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f9;
  color:#17202a;
}
header{
  background:#123b56;
  color:white;
  padding:28px 18px;
  text-align:center;
}
h1{margin:0;font-size:26px}
.tag{color:#8bd3ff}
.wrap{
  max-width:720px;
  margin:28px auto;
  padding:0 15px;
}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}
label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}
input,select,button{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ccd5dc;
  font-size:16px;
}
button{
  background:#123b56;
  color:white;
  border:0;
  font-weight:bold;
  margin-top:16px;
}
button:active{transform:scale(.98)}
.result{
  border-left:5px solid #2b9b63;
  padding:14px;
  background:#f7faf8;
  margin-top:18px;
  border-radius:8px;
}
.steps{
  display:flex;
  gap:6px;
  margin-top:14px;
  flex-wrap:wrap;
}
.step{
  padding:8px 10px;
  border-radius:20px;
  background:#e7edf2;
  font-size:13px;
}
.active{
  background:#2b9b63;
  color:white;
}
small{color:#667}
hr{
  border:0;
  border-top:1px solid #ddd;
  margin:20px 0;
}
</style>
</head>

<body>

<header>
  <h1>SWETA <span class="tag">COURIER</span></h1>
  <div>Fast • Safe • Reliable</div>
</header>

<div class="wrap">

  <div class="card">
    <h2>Track Your Parcel</h2>

    <label>AWB / Tracking Number</label>
    <input id="track" placeholder="Enter AWB number">

    <button onclick="trackParcel()">Track Parcel</button>

    <div id="trackResult"></div>
  </div>

  <div class="card">
    <h2>Book a Parcel</h2>

    <label>AWB Number</label>
    <input id="awb" placeholder="Enter AWB number">

    <label>Sender Name</label>
    <input id="sender" placeholder="Sender name">

    <label>Receiver Name</label>
    <input id="receiver" placeholder="Receiver name">

    <label>Current Status</label>
    <select id="status">
      <option>Booked</option>
      <option>In Transit</option>
      <option>Out for Delivery</option>
      <option>Delivered</option>
    </select>

    <button onclick="saveParcel()">Save Parcel</button>

    <div id="saveResult"></div>
  </div>

  <div class="card">
    <h2>About Sweta Courier</h2>
    <p>Reliable parcel delivery and easy shipment tracking.</p>
    <small>© 2026 SWETA COURIER</small>
  </div>

</div>

<script>
const key="sweta_parcels";

function data(){
  return JSON.parse(localStorage.getItem(key)||"{}");
}

function saveParcel(){
  let a=document.getElementById("awb").value.trim();
  let sender=document.getElementById("sender").value.trim();
  let receiver=document.getElementById("receiver").value.trim();
  let status=document.getElementById("status").value;

  if(!a){
    msg("Enter an AWB number");
    return;
  }

    awb:a,

    status:status,
    updated:new Date().toLocaleString()
  };
