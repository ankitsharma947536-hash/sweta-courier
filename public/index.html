
  <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWETA COURIER — Tracking</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f9;
  color:#17202a;
}

header{
  background:#123b56;
  color:white;
  padding:28px 18px;
  text-align:center;
}

h1{
  margin:0;
  font-size:28px;
}

.tag{
  display:inline-block;
  margin-top:8px;
  padding:6px 12px;
  border-radius:20px;
  background:#2b9b63;
  font-size:13px;
}

.wrap{
  max-width:720px;
  margin:28px auto;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#123b56;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
}

input,select,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #ccd5dc;
  border-radius:9px;
  font-size:15px;
}

button{
  margin-top:15px;
  background:#123b56;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.92;
}

.result{
  border-left:5px solid #2b9b63;
  padding:15px;
  margin-top:18px;
  background:#f5faf7;
  border-radius:8px;
}

.steps{
  display:flex;
  gap:6px;
  margin-top:15px;
}

.step{
  flex:1;
  height:8px;
  background:#d8dee3;
  border-radius:10px;
}

.step.active{
  background:#2b9b63;
}

small{
  color:#667;
}

footer{
  text-align:center;
  padding:25px;
  color:#667;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>SWETA <span class="tag">COURIER</span></h1>
  <p>Fast • Safe • Reliable</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>Track Your Parcel</h2>

    <label for="awb">AWB / Tracking Number</label>
    <input id="awb" type="text" placeholder="Enter tracking number">

    <button onclick="trackParcel()">Track Parcel</button>

    <div id="trackingResult"></div>
  </div>

  <div class="card">
    <h2>Book a Parcel</h2>

    <label>AWB Number</label>
    <input id="bookAwb" placeholder="Example: SC10001">

    <label>Sender Name</label>
    <input id="sender" placeholder="Sender name">

    <label>Receiver Name</label>
    <input id="receiver" placeholder="Receiver name">

    <label>Status</label>
    <select id="status">
      <option value="Booked">Booked</option>
      <option value="Picked Up">Picked Up</option>
      <option value="In Transit">In Transit</option>
      <option value="Out for Delivery">Out for Delivery</option>
      <option value="Delivered">Delivered</option>
    </select>

    <button onclick="saveParcel()">Save Parcel</button>

    <div id="saveResult"></div>
  </div>

  <div class="card">
    <h2>About Sweta Courier</h2>
    <p>
      Sweta Courier provides simple, fast and reliable parcel delivery
      tracking. Enter your AWB number above to check the latest parcel status.
    </p>
  </div>

</div>

<footer>
  © 2026 SWETA COURIER • Fast • Safe • Reliable
</footer>

<script>

function getParcels(){
  return JSON.parse(localStorage.getItem("swetaParcels") || "{}");
}

function saveParcel(){

  const awb=document.getElementById("bookAwb").value.trim();
  const sender=document.getElementById("sender").value.trim();
  const receiver=document.getElementById("receiver").value.trim();
  const status=document.getElementById("status").value;

  if(!awb || !sender || !receiver){
    document.getElementById("saveResult").innerHTML =
      '<div class="result">Please fill all details.</div>';
    return;
  }

  const parcels=getParcels();

  parcels[awb]={
    awb:awb,
    sender:sender,
    receiver:receiver,
    status:status
  };

  localStorage.setItem("swetaParcels",JSON.stringify(parcels));

  document.getElementById("saveResult").innerHTML =
    '<div class="result"><b>Parcel saved successfully!</b><br>AWB: '+awb+'</div>';

  document.getElementById("bookAwb").value="";
  document.getElementById("sender").value="";
  document.getElementById("receiver").value="";
}

function trackParcel(){

  const awb=document.getElementById("awb").value.trim();
  const result=document.getElementById("trackingResult");

  if(!awb){
    result.innerHTML='<div class="result">Please enter an AWB number.</div>';
    return;
  }

  const parcels=getParcels();
  const parcel=parcels[awb];

  if(!parcel){
    result.innerHTML=
      '<div class="result"><b>Parcel not found.</b><br>Please check your AWB number.</div>';
    return;
  }

  const statuses=[
    "Booked",
    "Picked Up",
    "In Transit",
    "Out for Delivery",
    "Delivered"
  ];

  const current=statuses.indexOf(parcel.status);

  let steps="";

  statuses.forEach((s,i)=>{
    steps += '<div class="step '+(i<=current?'active':'')+'"></div>';
  });

  result.innerHTML=`
    <div class="result">
      <h3>Parcel Found</h3>

      <p><b>AWB:</b> ${parcel.awb}</p>
      <p><b>Sender:</b> ${parcel.sender}</p>
      <p><b>Receiver:</b> ${parcel.receiver}</p>
      <p><b>Status:</b> ${parcel.status}</p>

      <div class="steps">${steps}</div>

      <small>Tracking updated successfully.</small>
    </div>
  `;
}

</script>

</body>
</html>
